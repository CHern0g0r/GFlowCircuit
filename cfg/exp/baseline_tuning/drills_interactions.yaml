    kind: screen
    algorithm: drills
    dependencies: []
    circuits: [C1355, dalu]
    factorial:
      factors: [learning_rate_low, long_credit, value_loss_high]
      cells:
        control: [0, 0, 0]
        learning_rate_low: [1, 0, 0]
        long_credit: [0, 1, 0]
        value_loss_high: [0, 0, 1]
        lr_low_long_credit: [1, 1, 0]
        long_credit_value_high: [0, 1, 1]
        lr_low_value_high: [1, 0, 1]
        lr_low_long_credit_value_high: [1, 1, 1]
      interaction_profiles:
        - lr_low_long_credit
        - long_credit_value_high
        - lr_low_value_high
        - lr_low_long_credit_value_high

martin:
