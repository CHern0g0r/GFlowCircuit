          learning_rate: 0.001
          gamma: 0.99
          algorithm.drills.value_loss_coef: 1.0
          algorithm.drills.normalize_advantages: false
          algorithm.drills.clip_grad_norm: null
      - id: lr_low_value_high
        overrides:
          learning_rate: 0.0003
          gamma: 0.9
          algorithm.drills.value_loss_coef: 1.0
          algorithm.drills.normalize_advantages: false
          algorithm.drills.clip_grad_norm: null
      - id: lr_low_long_credit_value_high
        overrides:
          learning_rate: 0.0003
          gamma: 0.99
          algorithm.drills.value_loss_coef: 1.0
          algorithm.drills.normalize_advantages: false
          algorithm.drills.clip_grad_norm: null

stages:
